name: "encyclopedia_style"
description: "Rong's encyclopedia writing style"
examples:
  - "Supported Platforms | | | | | BIND 9 | ✅ | | BIND 8 | ✅ | | Other DNS servers | ⚠️ (syntax may vary) | What is BIND Format? BIND (Berkeley Internet Name Domain) is the most widely used DNS server software on the Internet."
  - "Its zone file format has become the de facto standard for DNS record configuration. Understanding BIND format is essential for managing DNS zones, whether you're running your own nameserver or configuring records through a DNS provider."
  - "Zone file structure A BIND zone file contains DNS resource records (RRs) in a specific format: name TTL class type rdata Note: The TTL and class fields are optional if defaults are set. Most commonly, you'll see just the name, type, and data."
  - "( 2025120201 ; Serial 3600 ; Refresh 1800 ; Retry 604800 ; Expire 86400 ) ; Minimum TTL IN NS ns1.example.com."
  - "Key points: $ORIGIN sets the default domain suffix $TTL defines the default Time To Live @ represents the origin (zone name) IN stands for Internet class (almost always used) 3."
  - "Syntaxe de base Les scripts Bash commencent généralement par une ligne shebang pour spécifier l'interpréteur : #!/bin/bash Les variables sont assignées sans espaces autour du signe = : variable=\"valeur\" Pour accéder à la valeur d'une variable, utilisez le symbole $ : echo $nom_variable Liste des variables système courantes $(pwd) : Le répertoire de travail actuel."
  - "$LOGNAME : Nom de l'utilisateur connecté, resistant à su . $USER : Nom de l'utilisateur courante, peut-être affecté par su . $PATH : Liste des répertoires où chercher les exécutables. $SHELL : Chemin de l'interpréteur de commandes utilisé."
  - ": Code de retour de la dernière commande exécutée. arguments passés au script $# : Nombre d'arguments passés au script."
  - "Gestion des sorties Opérateur Description > {fichier} Redirige la sortie standard vers un fichier 2> Redirige les erreurs standard vers un fichier 2>&1 Redirige les erreurs standard vers la sortie standard &> Redirige les sorties standard et les erreurs vers un fichier >> Ajoute la sortie standard à un fichier 2>> Ajoute les erreurs standard à un fichier &>> Ajoute les sorties standard et les erreurs à un fichier Utilisez /dev/null , le trou noir de Linux, pour ignorer les sorties."
  - "Exemples : # Rediriger la sortie standard vers un fichier commande > sortie.txt # Rediriger les erreurs standard vers un fichier commande 2> erreurs.txt # Rediriger à la fois la sortie standard et les erreurs standard vers le même fichier commande &> sortie_et_erreurs.txt # Ajouter la sortie standard à un fichier commande >> sortie.txt # Ajouter les erreurs standard à un fichier commande 2>> erreurs.txt # Ajouter à la fois la sortie standard et les erreurs standard au même fichier commande &>> sortie_et_erreurs.txt sudo ls > /root/fichier #❌ C'est sudo qui est redirigé Tableaux Description Exemple de code Définir un tableau nom_tableau=(valeur1 valeur2 valeur3) Accéder à un élément (index 0) echo ${nom_tableau[0]} Obtenir tous les éléments echo ${nom_tableau[@]} Obtenir la longueur d'un tableau echo ${#nom_tableau[@]} Dictionnaires (Tableaux associatifs) Les dictionnaires (ou tableaux associatifs) en Bash permettent de stocker des paires clé-valeur."
  - "Download the latest release of Guacamole server #!/bin/bash set -euo pipefail # For Linux Mint / Ubuntu: install required build deps including libpng dev sudo apt-get update # Install common build tools and libraries needed by guacamole-server sudo apt install -y \\ build-essential \\ autoconf \\ automake \\ libtool \\ pkg-config \\ wget \\ ca-certificates \\ libcairo2-dev \\ libpng-dev \\ libjpeg-dev \\ libossp-uuid-dev \\ libpango1.0-dev \\ libssl-dev \\ freerdp2-dev \\ libvncserver-dev \\ libssh2-1-dev \\ libtelnet-dev \\ libwebp-dev \\ libpulse-dev \\ libvorbis-dev \\ libwebsockets-dev # Download and build Guacamole server wget -O guacamole-server-1.6.0.tar.gz \"https://apache.org/dyn/closer.lua/guacamole/1.6.0/source/guacamole-server-1.6.0.tar.gz?action=download\" tar -xzf guacamole-server-1.6.0.tar.gz cd guacamole-server-1.6.0 ./configure make -j\"$(nproc)\" sudo make install sudo ldconfig code guacd.service [Unit] Description=Guacamole proxy daemon After=network.target [Service] Type=simple ExecStart=/usr/local/sbin/guacd -f Restart=on-failure [Install] WantedBy=multi-user.target sudo cp guacd.service /etc/systemd/system/guacd.service sudo systemctl daemon-reload sudo systemctl enable guacd sudo systemctl start guacd Install Tomcat (alternatives possible) Set up Guacamole client wget https://apache.org/dyn/closer.lua/guacamole/1.6.0/binary/guacamole-1.6.0.war -O guacamole.war sudo mv guacamole.war /opt/tomcat/updated/webapps/guacamole.war sudo mkdir -p /etc/guacamole sudo nano /etc/guacamole/guacamole.properties guacd-hostname: localhost guacd-port: 4822 user-mapping: /etc/guacamole/user-mapping.xml sudo nano /etc/guacamole/user-mapping.xml <user-mapping> <authorize username=\"ron\" password=\"password\"> <connection name=\"TestConnection\"> <protocol>ssh</protocol> <param name=\"hostname\">127.0.0.1</param> <param name=\"port\">22</param> </connection> </authorize> </user-mapping> sudo chown -R tomcat:tomcat /etc/guacamole sudo systemctl restart guacd sudo systemctl restart tomcat Install openssh-server if haven't already sudo apt update sudo apt install openssh-server sudo systemctl enable --now ssh Testing Access localhost:8080/guacomole in a browser on the same device."
  - "You should be able to log-in and access the terminal. Repeat on another device on the same LAN (home wifi, with device discovery turned on, for example)."
  - "Substitute localhost with the local IP address of your server device (the computer you are setting up Guacamole on). Set up port forwarding and try on a device on the public internet !"
  - "Substitude localhost with your public IP address and the port number 8080 witht the public port you set up (nothing technically prevents it from also being 8080, but for improved security use a less known port as attackers target commonly known ports)."
  - "Production use Change immediately the user name and passwords in user-mapping.xml to something much harder to guess after 7.3."
  - "IP address digital equivalent of post address identifies location of devices facilitate exchange of information dynamic : controlled variation local vs."
  - "street adress Knowing my IP address hostname -I curl ifconfig.me MAC address Media Access Control like a birth registration number generally static"
  - "Born into P.R.C., I grew up like most of my peers, atheists. In secondary school, we discussed the origins of Christianity, Judaism, Islam, and Buddhism."
  - "Of course, all of those religions were presented to us in the most outrageous manner possible to strengthen our faith in atheism and focus on worshipping communist dictators. I came to Christianity later in life when I was 19."
  - "Luck has it I was first preached \"the good news\" by a couple of Jehovah’s Witnesses, a very particular Christian denomination. I mean, some go as far as calling them a bible-inspired cult."
  - "Michael’s Church, that I started to discover the charm of Christianity. When he is not our chaplain, he is a natural scientist."
  - "His knowledge and perspective of both science and religion inspire me to study Christianity and to live well and do good as the bible prescribed."
