- 'File permissions in numeric form on Linux Overview Linux file permissions control
  access for three user classes: owner group others Each class has three permission
  bits: read (r), write (w), execute (x).'
- Permission bits and numeric values 0 = --- (no permissions) 1 = --x (execute only)
  2 = -w- (write only) 3 = -wx (write + execute) 4 = r-- (read only) 5 = r-x (read
  + execute) 6 = rw- (read + write) 7 = rwx (read + write + execute) Combine three
  digits to represent owner-group-others (e.g., 754).
- Common examples 755 7 (owner) = rwx 5 (group) = r-x 5 (others)= r-x Typical for
  executable programs and public scripts. 644 6 (owner) = rw- 4 (group) = r-- 4 (others)=
  r-- Typical for text files and configuration files.
- This article contains AI generated content verified by a human. Background Modern
  browsers implement the Same Origin Policy to protect users. An origin is defined
  by the combination of protocol, domain, and port .
- If any of these differ between a web page and the resource it requests, the request
  is considered cross‑origin .
- 'Examples: http://example.com vs https://example.com → different protocol, different
  origin http://localhost:3000 vs http://localhost:3010 → different port, different
  origin https://app.example.com vs https://api.example.com → different subdomain,
  different origin When a frontend application tries to call an API hosted on a different
  origin, the browser blocks the response unless the server explicitly allows it.'
- '| v If ALL match → Same Origin → Allowed directly If ANY differ → Cross Origin
  → Trigger CORS check | v [ Preflight Request (OPTIONS) ] Browser asks server: "Do
  you allow this origin?" | v Server Response Headers: Access-Control-Allow-Origin:
  https://app.example.com Access-Control-Allow-Methods: GET, POST, OPTIONS Access-Control-Allow-Headers:
  Content-Type, Authorization | v If headers match → Browser allows request If headers
  missing/invalid → Browser blocks request Without it, any website you visit could
  secretly make requests to other sites where you’re logged in (like your bank, email,
  or social media) and read the responses.'
- Ensure you are running bash getent passwd <username> sudo chsh -s /bin/bash <username>
  1. Customize your Bash prompt The Bash prompt is controlled by the PS1 environment
  variable.
- 'Add the following to your ~/.bashrc : # Basic colored prompt with username, hostname,
  and current directory export PS1="\[\e[32m\]\u@\h\[\e[0m\]:\[\e[34m\]\w\[\e[0m\]\$
  " The \e[32m sets green color, \u shows username, \h shows hostname, \w shows working
  directory, and \e[0m resets color.'
- 'Add these to ~/.bashrc : # Navigation alias ..=''cd ..'' alias ...=''cd ../..''
  alias ll=''ls -lah'' alias la=''ls -A'' # Safety nets alias rm=''rm -i'' alias cp=''cp
  -i'' alias mv=''mv -i'' # Git shortcuts alias gs=''git status'' alias ga=''git add''
  alias gc=''git commit'' alias gp=''git push'' alias gl=''git log --oneline --graph
  --decorate'' # System alias update=''sudo apt update && sudo apt upgrade -y'' alias
  ports=''netstat -tulanp'' 3.'
- 'Enable better command history Add these lines to ~/.bashrc for improved history
  management: # Don''t save duplicate commands export HISTCONTROL=ignoredups:erasedups
  # Larger history export HISTSIZE=10000 export HISTFILESIZE=20000 # Append to history
  file, don''t overwrite shopt -s histappend # Save multi-line commands as one entry
  shopt -s cmdhist 4.'
- To deploy Prisma, you should create a second database in your Prisma project. mv
  .env .env.dev Then create a env.production file similar to your env file, with the
  production database url.
